<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>DrawCircuit · Document-space current QA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      localStorage.setItem('drawcircuit.zoom.v1', JSON.stringify(Number(params.get('zoom') || 1)));
      const { currentZoomFixture } = await import('/tests/helpers/currentZoomFixture.ts');
      const { useEditorStore } = await import('/src/store/editorStore.ts');
      const doc = currentZoomFixture(params.get('scene') || 'circuit');
      useEditorStore.setState({
        document: doc,
        selection: [],
        past: [],
        future: [],
        tool: 'select',
        grid: true,
      });
      await import('/src/main.tsx');
      const { exportPNG } = await import('/src/png/exporter.ts');
      const { exportSVG } = await import('/src/svg/exporter.tsx');
      const { exportTikz, exportObsidian } = await import('/src/tikz/exporter.ts');
      const { serializeDocument } = await import('/src/model/serialization.ts');
      const reader = new FileReader();
      reader.readAsDataURL(await exportPNG(doc));
      await new Promise((resolve) => (reader.onload = resolve));
      const artifact = document.createElement('script');
      artifact.id = 'qa-exports';
      artifact.type = 'application/json';
      artifact.textContent = JSON.stringify({
        json: serializeDocument(doc),
        svg: exportSVG(doc),
        png: reader.result,
        tikz: exportTikz(doc),
        obsidian: exportObsidian(doc),
      });
      document.body.append(artifact);
    </script>
  </body>
</html>
