    <script>
      window.addEventListener('load', () => {
        const origin = { x: 429.315, y: 82.98 },
          expected = [
            { text: 'r_{AB}', x: -120, y: -30, size: 23 },
            { text: 'r_{BC}', x: 120, y: -30, size: 23 },
            { text: 'r_{AC}', x: 0, y: -190, size: 23 },
            { text: 'r_{AD}', x: -284, y: 120, size: 23 },
            { text: 'r_{BD}', x: 44, y: 120, size: 23 },
            { text: 'r_{CD}', x: 284, y: 120, size: 23 },
            { text: 'A', x: -266, y: 5, size: 27 },
            { text: 'B', x: 0, y: -30, size: 27 },
            { text: 'C', x: 266, y: 5, size: 27 },
            { text: 'D', x: 0, y: 254, size: 27 },
            { text: 'maglia 1', x: -120, y: 117, size: 20 },
            { text: 'i_1', x: -120, y: -100, size: 23 },
            { text: 'I_1', x: -598, y: 100, size: 22 },
            { text: 'L_1', x: -550, y: -190, size: 22 },
            { text: 'R_1', x: -430, y: -190, size: 22 },
            { text: 'R_2', x: -340, y: -190, size: 22 },
            { text: 'R_3', x: -550, y: 230, size: 22 },
            { text: 'R_4', x: -400, y: 230, size: 22 },
            { text: 'i_1', x: 108, y: 100, size: 23 },
          ];
        const texts = [...document.querySelectorAll('#obsidian-reference text')];
        const used = new Set();
        const rows = expected.map((l) => {
          const first = l.text.includes('_') ? l.text[0] : l.text;
          const matches = texts.filter(
            (t) =>
              t.textContent === first &&
              Number(t.getAttribute('font-size')) === l.size &&
              !used.has(t),
          );
          const values = matches
            .map((t) => {
              const m = t.transform.baseVal.consolidate().matrix;
              const x = ((m.e - origin.x) * 4) / 3,
                y = ((m.f - origin.y) * 4) / 3;
              return { t, x, y, error: Math.hypot(x - l.x, y - l.y) };
            })
            .sort((a, b) => a.error - b.error);
          const best = values[0];
          if (!best) return { text: l.text, error: 999 };
          used.add(best.t);
          const css = getComputedStyle(best.t);
          return {
            text: l.text,
            error: best.error,
            font: css.fontFamily,
            size: l.size,
            weight: css.fontWeight,
            style: css.fontStyle,
          };
        });
        document.querySelector('#metrics').textContent = JSON.stringify(
          {
            labelPositions: rows,
            maxError: Math.max(...rows.map((r) => r.error)),
            pass: rows.every((r) => r.error < 0.02),
          },
          null,
          2,
        );
      });
